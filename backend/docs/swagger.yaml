# ===================================================
#                   API METADATA
# ===================================================
openapi: 3.0.3
info:
  title: FixItHub API
  version: 1.0.0
  description: |
    ## FixItHub API Documentation
    Platform for buying, selling, and repairing used products

    ### Project Status
    - Development: Active
    - Environment: Production

  contact:
    name: FixItHub Support
    email: support@fixithub.com
  license:
    name: Proprietary
    url: https://fixithub.com/terms

servers:
  - url: http://localhost:5000
    description: Local development server
  - url: https://api.fixithub.com
    description: Production server

# ===================================================
#                 API TAGS DEFINITION
# ===================================================
# Tags help organize endpoints into logical groups
# Add new tags here when creating new endpoint categories
tags:
  - name: Service Health
    description: Service status monitoring
  - name: Root
    description: Base API endpoints
  - name: Users
    description: User profile management and listings

# ===================================================
#                API ENDPOINT DEFINITIONS
# ===================================================
# Paths define your API endpoints and operations
# Group related endpoints using tags
# Maintain consistent parameter naming conventions
paths:
  /:
    get:
      tags: [Root]
      summary: API Root
      description: Returns basic API information
      responses:
        "200":
          description: API root information
          content:
            text/html:
              example: |
                <h1>FixItHub API Service</h1>
                <p>Hello, 𝕬𝖓𝖔𝖔𝖘 🖤! Welcome to FixItHub Backend System 🚀</p>
                <ul>
                  <li><a href="/api-docs">API Documentation</a></li>
                  <li><a href="/api/v1/health">Service Health</a></li>
                </ul>

  /api/v1/health:
    get:
      tags: [Service Health]
      summary: Service Health Check
      description: Returns current service status and database connectivity
      responses:
        "200":
          description: Service health status
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: OK
                  db:
                    type: string
                    example: connected
                  version:
                    type: string
                    example: 1.0.0
                  environment:
                    type: string
                    example: development
                required:
                  - status
                  - db
                  - version
                  - environment

  /api/v1/users/me:
    get:
      tags: [Users]
      summary: Get authenticated user's profile
      description: Retrieve complete profile details for the logged-in user
      security:
        - BearerAuth: []
      responses:
        "200":
          description: User profile retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrivateUser"
        "401":
          $ref: "#/components/responses/UnauthorizedError"

    patch:
      tags: [Users]
      summary: Update user profile
      description: Update profile information for authenticated user
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                profile.bio:
                  type: string
                  maxLength: 500
                profile.phone:
                  type: string
                profile.address:
                  $ref: "#/components/schemas/Address"
                profile.socialMedia:
                  $ref: "#/components/schemas/SocialMedia"
                profile.avatar:
                  type: string
                  format: uri
      responses:
        "200":
          description: Profile updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrivateUser"
        "400":
          description: Invalid update data
        "401":
          $ref: "#/components/responses/UnauthorizedError"

  /api/v1/users/workers:
    get:
      tags: [Users]
      summary: List approved workers
      description: Get paginated list of approved service providers with filtering
      parameters:
        - in: query
          name: skills
          schema:
            type: string
          description: Comma-separated list of skills
        - in: query
          name: minRating
          schema:
            type: number
            minimum: 0
            maximum: 5
          description: Minimum average rating
        - in: query
          name: availability
          schema:
            type: string
            enum: [full-time, part-time]
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
      responses:
        "200":
          description: List of workers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedWorkers"

  /api/v1/users/customers:
    get:
      tags: [Users]
      summary: List customers (Admin only)
      description: Get paginated list of registered customers
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: city
          schema:
            type: string
          description: Filter by city
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
      responses:
        "200":
          description: List of customers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedCustomers"
        "403":
          description: Admin privileges required

  /api/v1/users/{id}:
    get:
      tags: [Users]
      summary: Get public user profile
      description: Retrieve public profile information for any user
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            pattern: "^[0-9a-fA-F]{24}$"
          description: Valid MongoDB ObjectId
      responses:
        "200":
          description: Public user profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicUser"
        "404":
          description: User not found

  /api/v1/upload:
    post:
      tags: [Media]
      summary: Upload image files
      description: Handle multiple image uploads and return Cloudinary URLs
      parameters:
        - in: header
          name: Content-Type
          required: true
          schema:
            type: string
            example: multipart/form-data
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                files:
                  type: array
                  items:
                    type: string
                    format: binary
                  description: Array of image files (max 5)
      responses:
        '200':
          description: Image upload successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadResponse'
        '400':
          description: Invalid file upload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Image processing error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ... other path definitions ...

# ===================================================
#           GLOBAL COMPONENTS & SCHEMAS
# ===================================================
# Reusable components for:
# - Schemas (data models)
# - Parameters
# - Responses
# - Security Schemes
# - Examples
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Use JWT token for authentication

  responses:
    UnauthorizedError:
      description: Missing or invalid authentication
    NotFoundError:
      description: The requested resource was not found

  schemas:
    Address:
      type: object
      properties:
        street:
          type: string
        city:
          type: string
        state:
          type: string
          maxLength: 2
        zip:
          type: string
        country:
          type: string
          default: "US"

    SocialMedia:
      type: object
      properties:
        website:
          type: string
          format: uri
        linkedin:
          type: string
          format: uri
        twitter:
          type: string
          format: uri

    PublicUser:
      type: object
      properties:
        _id:
          type: string
        username:
          type: string
        role:
          type: string
          enum: [customer, worker, admin]
        profile:
          type: object
          properties:
            avatar:
              type: string
        rating:
          $ref: "#/components/schemas/Rating"
        workerApplication:
          type: object
          properties:
            skills:
              type: array
              items:
                type: string

    PrivateUser:
      allOf:
        - $ref: "#/components/schemas/PublicUser"
        - type: object
          properties:
            email:
              type: string
              format: email
            status:
              type: string
              enum: [active, banned, pending, deactivated]
            createdAt:
              type: string
              format: date-time
            lastLogin:
              type: string
              format: date-time

    Rating:
      type: object
      properties:
        average:
          type: number
          format: float
          minimum: 0
          maximum: 5
        count:
          type: integer
          minimum: 0

    PaginatedWorkers:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: "#/components/schemas/PublicUser"
        pagination:
          $ref: "#/components/schemas/Pagination"

    PaginatedCustomers:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            type: object
            properties:
              _id:
                type: string
              username:
                type: string
              profile:
                type: object
                properties:
                  address:
                    $ref: "#/components/schemas/Address"
              createdAt:
                type: string
                format: date-time
              lastLogin:
                type: string
                format: date-time
        pagination:
          $ref: "#/components/schemas/Pagination"

    Pagination:
      type: object
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
        totalPages:
          type: integer

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string
          example: "Validation failed"
        details:
          type: array
          items:
            type: string
          example: ["username must be at least 3 characters"]

    UploadResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        count:
          type: integer
          example: 3
        urls:
          type: array
          items:
            $ref: '#/components/schemas/UploadResult'
        message:
          type: string
          example: "Uploaded"
    
    UploadResult:
      type: object
      properties:
        url:
          type: string
          format: uri
          example: "https://res.cloudinary.com/demo/image/upload/v123/example.jpg"
        resourceType:
          type: string
          example: "image"
        bytes:
          type: integer
          example: 102400

  responses:
    TooManyRequestsError:
      description: Rate limit exceeded

security:
  - BearerAuth: []
