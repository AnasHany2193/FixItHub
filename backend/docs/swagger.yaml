openapi: 3.0.3
info:
  title: FixItHub API
  version: 1.0.0
  description: |
    Marketplace connecting users with repair service providers and refurbished products.
    Features include auction-based repair requests, product listings, and secure file uploads.
servers:
  - url: http://localhost:5000/api/v1
    description: Local development server
  - url: https://api.fixithub.com/api/v1
    description: Production server

# ======================
# Common Components
# ======================
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: token
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    User:
      type: object
      properties:
        _id:
          type: string
          format: mongoId
          example: 65f8d7e8cdf1b203f8d7e8cd
        username:
          type: string
          minLength: 3
          maxLength: 30
          example: tech_repair_guru
        email:
          type: string
          format: email
          example: user@fixithub.com
        role:
          type: string
          enum: [customer, worker, admin]
          default: customer
        profile:
          type: object
          properties:
            avatar:
              type: object
              properties:
                url:
                  type: string
                  format: uri
                  example: https://res.cloudinary.com/demo/image/upload/d_avatar.png/non_existing_id.png
                public_id:
                  type: string
                  example: sample_public_id
            phone:
              type: string
              example: +1234567890
            address:
              type: object
              properties:
                street: { type: string }
                city: { type: string }
                state:
                  type: string
                  maxLength: 2
                  example: NY
                zip: { type: string }
                country:
                  type: string
                  default: US
            bio:
              type: string
              maxLength: 500
              example: Certified electronics repair specialist
            socialMedia:
              type: object
              properties:
                website: { type: string, format: uri }
                linkedin: { type: string, format: uri }
                twitter: { type: string, format: uri }
        workerApplication:
          type: object
          properties:
            skills:
              type: array
              items:
                type: string
                example: electronics
            certifications:
              type: array
              items: { type: string }
            experience:
              type: string
              enum: [beginner, intermediate, expert]
            status:
              type: string
              enum: [pending, approved, rejected]
            documents:
              type: array
              items:
                type: object
                properties:
                  url: { type: string, format: uri }
                  public_id: { type: string }
            workHistory:
              type: array
              items:
                type: object
                properties:
                  position: { type: string }
                  company: { type: string }
                  startYear:
                    type: integer
                    minimum: 1900
                    example: 2018
                  endYear:
                    type: integer
                    minimum: 1900
                    example: 2023
            availability:
              type: string
              enum: [full-time, part-time, unavailable]
        stats:
          type: object
          properties:
            completedRepairs:
              type: integer
              minimum: 0
              example: 42
            completedSales:
              type: integer
              minimum: 0
              example: 15
            responseRate:
              type: number
              minimum: 0
              maximum: 100
              example: 92.5
        rating:
          type: object
          properties:
            average:
              type: number
              minimum: 0
              maximum: 5
              example: 4.5
            count:
              type: integer
              minimum: 0
              example: 24
        location:
          type: object
          properties:
            type:
              type: string
              enum: [Point]
            coordinates:
              type: array
              items: { type: number }
              minItems: 2
              maxItems: 2
              example: [-73.935242, 40.730610]
        status:
          type: string
          enum: [active, banned, pending, deactivated]
          default: active

    OTP:
      type: object
      description: One-Time Password document with security features
      properties:
        userId:
          type: string
          format: mongoId
          description: Associated user reference
          example: 65f8d7e8cdf1b203f8d7e8cd
        code:
          type: string
          description: Hashed 6-digit OTP code
          example: $2a$12$S4CX5hLfYw4R2kZq3XvJ7e
        expiresAt:
          type: string
          format: date-time
          description: Auto-expiration timestamp (TTL index)
          example: 2024-05-15T12:00:00Z
        type:
          type: string
          enum: [verification, passwordReset]
          default: verification
          description: OTP usage context
        attempts:
          type: integer
          minimum: 0
          maximum: 3
          default: 0
          description: Failed validation attempts
      required:
        - userId
        - code
        - expiresAt
        - type

    Bid:
      type: object
      properties:
        _id:
          type: string
          format: mongoId
          example: 65f8d7e8cdf1b203f8d7e8cd
        worker:
          $ref: "#/components/schemas/User/properties/_id"
        bidPrice:
          type: number
          minimum: 0.01
          example: 149.99
        estimatedTimeDays:
          type: integer
          minimum: 1
          example: 3
        auction:
          $ref: "#/components/schemas/Auction/properties/_id"
        status:
          type: string
          enum: [pending, accepted, rejected]
          default: pending
        submittedAt:
          type: string
          format: date-time
          readOnly: true
      required:
        - worker
        - bidPrice
        - estimatedTimeDays
        - auction
        - status

    Auction:
      type: object
      properties:
        _id:
          type: string
          format: mongoId
          example: 65f8d7e8cdf1b203f8d7e8cd
        repairRequest:
          $ref: "#/components/schemas/RepairRequest/properties/_id"
        startingMaxPrice:
          type: number
          minimum: 1
          example: 200.00
        status:
          type: string
          enum: [open, closed]
          default: open
        expiresAt:
          type: string
          format: date-time
          description: Future date for open auctions
        bids:
          type: array
          items:
            $ref: "#/components/schemas/Bid/properties/_id"
        currentLowestBid:
          $ref: "#/components/schemas/Bid/properties/_id"
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true
      required:
        - repairRequest
        - startingMaxPrice
        - status
        - expiresAt

    RepairRequest:
      type: object
      properties:
        _id:
          type: string
          format: mongoId
          example: 65f8d7e8cdf1b203f8d7e8cd
        customer:
          $ref: "#/components/schemas/User/properties/_id"
        title:
          type: string
          minLength: 1
          maxLength: 100
          example: iPhone 12 Screen Replacement
        category:
          type: string
          enum: [electronics, furniture, appliances, other]
          example: electronics
        issueDescription:
          type: string
          minLength: 20
          example: Cracked screen with touch functionality issues
        worker:
          $ref: "#/components/schemas/User/properties/_id"
        itemType:
          type: string
          maxLength: 50
          example: iPhone 12 Pro Max
        photos:
          type: array
          items:
            $ref: "#/components/schemas/CloudinaryImage"
          maxItems: 5
        shippingRequired:
          type: boolean
          default: false
        status:
          type: string
          enum:
            [
              pending,
              auction_open,
              in_progress,
              completed,
              cancelled,
              returning_to_customer,
            ]
          default: pending
          x-updatable: true
        paymentStatus:
          type: string
          enum: [pending, paid, failed, refunded]
          default: pending
        paymentAmount:
          type: number
          minimum: 0
          example: 149.99
        trackingUpdates:
          type: array
          items:
            type: object
            properties:
              status:
                type: string
                enum:
                  [
                    received,
                    diagnosing,
                    repairing,
                    quality_check,
                    shipped,
                    payment_received,
                    payment_failed,
                  ]
                x-updatable: true
              location:
                type: string
                maxLength: 100
                example: New York Repair Center
                x-updatable: true
              timestamp:
                type: string
                format: date-time
          x-updatable: false # Managed through dedicated endpoints
        bids:
          type: array
          items:
            $ref: "#/components/schemas/Bid/properties/_id"
          x-updatable: false
        auction:
          $ref: "#/components/schemas/Auction/properties/_id"
          x-updatable: false
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true
      required:
        - customer
        - title
        - category
        - issueDescription
        - itemType
        - status
        - paymentStatus
      x-usage:
        create:
          required: [customer, title, category, issueDescription, itemType]
        update:
          allowedFields: [status, trackingUpdates]

    Reservation:
      type: object
      properties:
        _id:
          type: string
          format: mongoId
          example: 65f8d7e8cdf1b203f8d7e8cd
        product:
          $ref: "#/components/schemas/Product/properties/_id"
        user:
          $ref: "#/components/schemas/User/properties/_id"
        status:
          type: string
          enum: [active, completed, expired]
          default: active
        quantity:
          type: integer
          minimum: 1
          example: 2
        expiresAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true
      required:
        - product
        - user
        - quantity
        - expiresAt

    Product:
      type: object
      properties:
        _id:
          type: string
          format: mongoId
          example: 65f8d7e8cdf1b203f8d7e8cd
        title:
          type: string
          maxLength: 100
          example: iPhone 12 Pro Max Refurbished
        description:
          type: string
          maxLength: 1000
          example: Factory-refurbished device with 1-year warranty
        type:
          type: string
          enum: [product, spare_part]
          default: product
        category:
          type: string
          enum: [electronics, furniture, appliances, other]
          example: electronics
        condition:
          type: string
          enum: [new, refurbished, used]
          example: refurbished
        price:
          type: number
          minimum: 0
          example: 599.99
        photos:
          type: array
          items:
            $ref: "#/components/schemas/CloudinaryImage"
          maxItems: 5
        stock:
          type: integer
          minimum: 0
          example: 10
        reservedStock:
          type: integer
          minimum: 0
          example: 2
        worker:
          $ref: "#/components/schemas/User/properties/_id"
        status:
          type: string
          enum: [active, archived]
          default: active
        location:
          $ref: "#/components/schemas/GeoJSONPoint"
        availableStock:
          type: integer
          readOnly: true
          example: 8
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true
      required:
        - title
        - description
        - type
        - category
        - condition
        - price
        - stock
        - worker

    BaseReview:
      type: object
      properties:
        _id:
          type: string
          format: mongoId
          example: 65f8d7e8cdf1b203f8d7e8cd
        rating:
          type: integer
          minimum: 1
          maximum: 5
          example: 5
        comment:
          type: string
          maxLength: 500
          example: Excellent service!
        customer:
          $ref: "#/components/schemas/User/properties/_id"
        createdAt:
          type: string
          format: date-time
          readOnly: true

    WorkerReview:
      allOf:
        - $ref: "#/components/schemas/BaseReview"
        - type: object
          properties:
            worker:
              $ref: "#/components/schemas/User/properties/_id"
            repairRequest:
              $ref: "#/components/schemas/RepairRequest/properties/_id"
          required:
            - worker
            - repairRequest

    ProductReview:
      allOf:
        - $ref: "#/components/schemas/BaseReview"
        - type: object
          properties:
            product:
              $ref: "#/components/schemas/Product/properties/_id"
            reservation:
              $ref: "#/components/schemas/Reservation/properties/_id"
          required:
            - product
            - reservation

    Report:
      type: object
      properties:
        _id:
          type: string
          format: mongoId
          example: 65f8d7e8cdf1b203f8d7e8cd
        reporter:
          $ref: "#/components/schemas/User/properties/_id"
        contentType:
          type: string
          enum: [product, repair, review, user]
          example: review
        contentId:
          type: string
          format: mongoId
          description: |
            Reference to reported content:
            - product: Product ID
            - repair: RepairRequest ID
            - review: Review ID
            - user: User ID
        reason:
          type: string
          enum:
            [
              spam,
              inappropriate,
              fraudulent,
              false_information,
              harassment,
              other,
            ]
          example: inappropriate
        description:
          type: string
          maxLength: 500
          example: Contains offensive language
        status:
          type: string
          enum: [pending, under_review, resolved, dismissed]
          default: pending
        resolvedBy:
          $ref: "#/components/schemas/User/properties/_id"
        actionsTaken:
          type: array
          items:
            type: string
            enum: [remove_content, warn_user, ban_user, no_action]
          example: [warn_user]
        resolutionNotes:
          type: string
          example: Issued warning to user
        resolvedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true
      required:
        - reporter
        - contentType
        - contentId
        - reason
        - status

    ImageUploadResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        count:
          type: integer
          example: 3
        urls:
          type: array
          items:
            type: object
            properties:
              url:
                type: string
                format: uri
                example: "https://res.cloudinary.com/demo/image/upload/v123/example.jpg"
              resourceType:
                type: string
                example: "image"
              bytes:
                type: integer
                example: 102400
        message:
          type: string
          example: "Uploaded"

# ======================
# API Endpoints
# ======================
paths:
  /upload:
    post:
      tags: [Media]
      summary: Upload images
      description: |
        Public image upload endpoint for all users
        - Max 5 images per request
        - Supported formats: JPG, PNG, WEBP
        - Max file size: 5MB
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                images:
                  type: array
                  items:
                    type: string
                    format: binary
      responses:
        200:
          description: Images uploaded successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageUploadResponse"
        400:
          description: No files uploaded
        413:
          description: File too large
        415:
          description: Invalid file type
        500:
          description: Server error

  /users/{id}:
    get:
      tags: [User]
      summary: Get user profile (Authenticated)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: mongoId
      responses:
        200:
          description: Public user profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicUser"

  /users/workers:
    get:
      tags: [Public]
      summary: List approved workers (Rate Limited)
      description: |
        Public endpoint with rate limiting
        - 100 requests/15 minutes
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
      responses:
        200:
          description: Paginated workers list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedWorkers"

  /users/me:
    get:
      tags: [User]
      summary: Get my profile (Authenticated)
      security:
        - bearerAuth: []
      responses:
        200:
          description: Full user profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

    patch:
      tags: [User]
      summary: Update my profile (Authenticated)
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        200:
          description: Updated user profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /users/customers:
    get:
      tags: [Admin]
      summary: List all customers (Admin Only)
      description: |
        Admin-only endpoint with strict rate limiting
        - 30 requests/minute
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
      responses:
        200:
          description: Paginated customers list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedCustomers"
