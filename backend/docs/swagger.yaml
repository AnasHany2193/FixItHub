# ===================================================
#                   API METADATA
# ===================================================
openapi: 3.0.3
info:
  title: FixItHub API
  version: 1.0.0
  description: |
    ## FixItHub API Documentation
    Platform for buying, selling, and repairing used products

    ### Project Status
    - Development: Active
    - Environment: Production

  contact:
    name: FixItHub Support
    email: support@fixithub.com
  license:
    name: Proprietary
    url: https://fixithub.com/terms

servers:
  - url: http://localhost:5000
    description: Local development server
  - url: https://api.fixithub.com
    description: Production server

# ===================================================
#                 API TAGS DEFINITION
# ===================================================
# Tags help organize endpoints into logical groups
# Add new tags here when creating new endpoint categories
tags:
  - name: Service Health
    description: Service status monitoring
  - name: Root
    description: Base API endpoints
  - name: Users
    description: User profile management and listings
  - name: Authentication
    description: User registration, login, and session management
  - name: Password Management
    description: Password reset and recovery operations
  - name: Auctions
    description: Auction listing and management operations
  - name: Bids
    description: Bid submission and management operations
  - name: Media
    description: Handle multiple image uploads and return Cloudinary URLs
  - name: Repairs
    description: Repair request lifecycle management

# ===================================================
#                API ENDPOINT DEFINITIONS
# ===================================================
# Paths define your API endpoints and operations
# Group related endpoints using tags
# Maintain consistent parameter naming conventions
paths:
  /:
    get:
      tags: [Root]
      summary: API Root
      description: Returns basic API information
      responses:
        "200":
          description: API root information
          content:
            text/html:
              example: |
                <h1>FixItHub API Service</h1>
                <p>Hello, 𝕬𝖓𝖔𝖔𝖘 🖤! Welcome to FixItHub Backend System 🚀</p>
                <ul>
                  <li><a href="/api-docs">API Documentation</a></li>
                  <li><a href="/api/v1/health">Service Health</a></li>
                </ul>

  /api/v1/health:
    get:
      tags: [Service Health]
      summary: Service Health Check
      description: Returns current service status and database connectivity
      responses:
        "200":
          description: Service health status
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: OK
                  db:
                    type: string
                    example: connected
                  version:
                    type: string
                    example: 1.0.0
                  environment:
                    type: string
                    example: development
                required:
                  - status
                  - db
                  - version
                  - environment

  /api/v1/users/me:
    get:
      tags: [Users]
      summary: Get authenticated user's profile
      description: Retrieve complete profile details for the logged-in user
      security:
        - BearerAuth: []
      responses:
        "200":
          description: User profile retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrivateUser"
        "401":
          $ref: "#/components/responses/UnauthorizedError"

    patch:
      tags: [Users]
      summary: Update user profile
      description: Update profile information for authenticated user
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                profile.bio:
                  type: string
                  maxLength: 500
                profile.phone:
                  type: string
                profile.address:
                  $ref: "#/components/schemas/Address"
                profile.socialMedia:
                  $ref: "#/components/schemas/SocialMedia"
                profile.avatar:
                  type: string
                  format: uri
      responses:
        "200":
          description: Profile updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrivateUser"
        "400":
          description: Invalid update data
        "401":
          $ref: "#/components/responses/UnauthorizedError"

  /api/v1/users/workers:
    get:
      tags: [Users]
      summary: List approved workers
      description: Get paginated list of approved service providers with filtering
      parameters:
        - in: query
          name: skills
          schema:
            type: string
          description: Comma-separated list of skills
        - in: query
          name: minRating
          schema:
            type: number
            minimum: 0
            maximum: 5
          description: Minimum average rating
        - in: query
          name: availability
          schema:
            type: string
            enum: [full-time, part-time]
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
      responses:
        "200":
          description: List of workers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedWorkers"

  /api/v1/users/customers:
    get:
      tags: [Users]
      summary: List customers (Admin only)
      description: Get paginated list of registered customers
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: city
          schema:
            type: string
          description: Filter by city
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
      responses:
        "200":
          description: List of customers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedCustomers"
        "403":
          description: Admin privileges required

  /api/v1/users/{id}:
    get:
      tags: [Users]
      summary: Get public user profile
      description: Retrieve public profile information for any user
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            pattern: "^[0-9a-fA-F]{24}$"
          description: Valid MongoDB ObjectId
      responses:
        "200":
          description: Public user profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicUser"
        "404":
          description: User not found

  /api/v1/upload:
    post:
      tags: [Media]
      summary: Upload image files
      description: Handle multiple image uploads and return Cloudinary URLs
      parameters:
        - in: header
          name: Content-Type
          required: true
          schema:
            type: string
            example: multipart/form-data
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                files:
                  type: array
                  items:
                    type: string
                    format: binary
                  description: Array of image files (max 5)
      responses:
        "200":
          description: Image upload successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadResponse"
        "400":
          description: Invalid file upload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Image processing error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/auth/register:
    post:
      tags: [Authentication]
      summary: Register new user
      description: Create customer/worker account (admin registration disabled)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegistrationRequest"
      responses:
        "201":
          description: Registration successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "403":
          description: Admin registration attempt
        "429":
          $ref: "#/components/responses/TooManyRequestsError"

  /api/v1/auth/verify-otp:
    post:
      tags: [Authentication]
      summary: Verify email with OTP
      description: Confirm user email using one-time password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OTPVerificationRequest"
      responses:
        "200":
          description: Email verified successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          description: Invalid/expired OTP
        "404":
          description: User not found

  /api/v1/auth/resend-otp:
    post:
      tags: [Authentication]
      summary: Resend verification OTP
      description: Request new OTP for email verification
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
              required: [email]
      responses:
        "200":
          description: New OTP sent successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          description: User already verified
        "429":
          $ref: "#/components/responses/TooManyRequestsError"

  /api/v1/auth/login:
    post:
      tags: [Authentication]
      summary: User login
      description: Authenticate user and issue access/refresh tokens
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
          headers:
            Set-Cookie:
              schema:
                type: string
                example: "refreshToken=abcde12345; Path=/; HttpOnly; Secure; SameSite=Strict"
        "401":
          description: Invalid credentials
        "403":
          description: Email not verified

  /api/v1/auth/refresh-token:
    post:
      tags: [Authentication]
      summary: Refresh access token
      description: Generate new access token using refresh token
      security: []
      responses:
        "200":
          description: New access token issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken:
                    type: string
        "401":
          description: Invalid/expired refresh token

  /api/v1/auth/forgot-password:
    post:
      tags: [Password Management]
      summary: Initiate password reset
      description: Send password reset OTP to registered email
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordRequest"
      responses:
        "200":
          description: OTP sent if email exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "429":
          $ref: "#/components/responses/TooManyRequestsError"

  /api/v1/auth/reset-password:
    post:
      tags: [Password Management]
      summary: Complete password reset
      description: Verify OTP and set new password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "200":
          description: Password reset successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          description: Invalid OTP or weak password

  /api/v1/auth/logout:
    post:
      tags: [Authentication]
      summary: Terminate session
      description: Invalidate refresh token and clear cookies
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Logout successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"

  /api/v1/auctions/available:
    get:
      tags: [Auctions]
      summary: Get available auctions
      description: List open auctions visible to workers
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: includeCustomer
          schema:
            type: boolean
            default: false
          description: Include customer details (admin only)
      responses:
        "200":
          description: List of available auctions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuctionListResponse"
        "403":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          description: No auctions found

  /api/v1/auctions/{auctionId}/bids:
    post:
      tags: [Bids]
      summary: Submit new bid
      description: Place bid on open auction (Worker only)
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: auctionId
          required: true
          schema:
            type: string
            pattern: "^[0-9a-fA-F]{24}$"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BidSubmissionRequest"
      responses:
        "201":
          description: Bid submitted successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BidResponse"
        "400":
          description: Invalid bid amount
        "429":
          $ref: "#/components/responses/TooManyRequestsError"

    get:
      tags: [Bids]
      summary: Get auction bids
      description: List all bids for specific auction
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: auctionId
          required: true
          schema:
            type: string
            pattern: "^[0-9a-fA-F]{24}$"
      responses:
        "200":
          description: Bids retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuctionBidsResponse"
        "404":
          description: Auction not found

  /api/v1/auctions/{auctionId}/bids/{bidId}:
    patch:
      tags: [Bids]
      summary: Update bid
      description: Modify existing bid (Worker only)
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: auctionId
          required: true
          schema:
            type: string
            pattern: "^[0-9a-fA-F]{24}$"
        - in: path
          name: bidId
          required: true
          schema:
            type: string
            pattern: "^[0-9a-fA-F]{24}$"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BidSubmissionRequest"
      responses:
        "200":
          description: Bid updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BidResponse"
        "403":
          description: Not bid owner

  /api/v1/auctions/{auctionId}/accept:
    post:
      tags: [Auctions]
      summary: Accept lowest bid
      description: Customer accepts winning bid and starts repair
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: auctionId
          required: true
          schema:
            type: string
            pattern: "^[0-9a-fA-F]{24}$"
      responses:
        "200":
          description: Bid accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptanceResponse"
        "403":
          description: Not auction owner

  /api/v1/repairs:
    post:
      tags: [Repairs]
      summary: Create repair request
      description: Customer creates new repair request with associated auction
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RepairRequestCreate"
      responses:
        "201":
          description: Repair request created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepairRequestResponse"
        "400":
          description: Invalid request data
        "429":
          $ref: "#/components/responses/TooManyRequestsError"

    get:
      tags: [Repairs]
      summary: Get active repairs
      description: List customer's active repair requests
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [pending, auction_open, in_progress]
      responses:
        "200":
          description: Repairs retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepairListResponse"

  /api/v1/repairs/{id}/status:
    patch:
      tags: [Repairs]
      summary: Update repair status
      description: Customer updates repair request status
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            pattern: "^[0-9a-fA-F]{24}$"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [cancelled, paused]
              required: [status]
      responses:
        "200":
          description: Status updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepairRequestResponse"

  /api/v1/repairs/{id}/cancel:
    patch:
      tags: [Repairs]
      summary: Cancel repair request
      description: Customer cancels repair and associated auction
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            pattern: "^[0-9a-fA-F]{24}$"
      responses:
        "200":
          description: Repair cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CancellationResponse"

  /api/v1/repairs/auctions:
    get:
      tags: [Repairs]
      summary: Get customer auctions
      description: List customer's active repair auctions
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Auctions retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuctionListResponse"

  /api/v1/repairs/history:
    get:
      tags: [Repairs]
      summary: Get repair history
      description: Customer's historical repair requests
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [completed, cancelled, returned]
        - in: query
          name: bidStatus
          schema:
            type: string
            enum: [pending, accepted, rejected]
      responses:
        "200":
          description: History retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepairHistoryResponse"

  /api/v1/repairs/{id}/complete:
    patch:
      tags: [Repairs]
      summary: Complete repair
      description: Worker marks repair as completed
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            pattern: "^[0-9a-fA-F]{24}$"
      responses:
        "200":
          description: Repair completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepairRequestResponse"

  /api/v1/repairs/{id}/shipping:
    patch:
      tags: [Repairs]
      summary: Update shipping status
      description: Worker updates item shipping status
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            pattern: "^[0-9a-fA-F]{24}$"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [shipped, in_transit, delivered]
                location:
                  type: string
              required: [status, location]
      responses:
        "200":
          description: Shipping updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShippingUpdateResponse"

  /api/v1/repairs/worker:
    get:
      tags: [Repairs]
      summary: Get worker's active repairs
      description: List repairs assigned to worker
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Repairs retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepairListResponse"

  /api/v1/repairs/worker/history:
    get:
      tags: [Repairs]
      summary: Get worker's repair history
      description: Historical repairs completed by worker
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [completed, returned]
      responses:
        "200":
          description: History retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepairHistoryResponse"

  /api/v1/repairs/{id}/return:
    patch:
      tags: [Repairs]
      summary: Initiate item return
      description: Worker returns item to customer
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            pattern: "^[0-9a-fA-F]{24}$"
      responses:
        "200":
          description: Return initiated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReturnResponse"

  # ... other path definitions ...

# ===================================================
#           GLOBAL COMPONENTS & SCHEMAS
# ===================================================
# Reusable components for:
# - Schemas (data models)
# - Parameters
# - Responses
# - Security Schemes
# - Examples
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Use JWT token for authentication

  schemas:
    Address:
      type: object
      properties:
        street:
          type: string
        city:
          type: string
        state:
          type: string
          maxLength: 2
        zip:
          type: string
        country:
          type: string
          default: "US"

    SocialMedia:
      type: object
      properties:
        website:
          type: string
          format: uri
        linkedin:
          type: string
          format: uri
        twitter:
          type: string
          format: uri

    PublicUser:
      type: object
      properties:
        _id:
          type: string
        username:
          type: string
        role:
          type: string
          enum: [customer, worker, admin]
        profile:
          type: object
          properties:
            avatar:
              type: string
        rating:
          $ref: "#/components/schemas/Rating"
        workerApplication:
          type: object
          properties:
            skills:
              type: array
              items:
                type: string

    PrivateUser:
      allOf:
        - $ref: "#/components/schemas/PublicUser"
        - type: object
          properties:
            email:
              type: string
              format: email
            status:
              type: string
              enum: [active, banned, pending, deactivated]
            createdAt:
              type: string
              format: date-time
            lastLogin:
              type: string
              format: date-time

    Rating:
      type: object
      properties:
        average:
          type: number
          format: float
          minimum: 0
          maximum: 5
        count:
          type: integer
          minimum: 0

    PaginatedWorkers:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: "#/components/schemas/PublicUser"
        pagination:
          $ref: "#/components/schemas/Pagination"

    PaginatedCustomers:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            type: object
            properties:
              _id:
                type: string
              username:
                type: string
              profile:
                type: object
                properties:
                  address:
                    $ref: "#/components/schemas/Address"
              createdAt:
                type: string
                format: date-time
              lastLogin:
                type: string
                format: date-time
        pagination:
          $ref: "#/components/schemas/Pagination"

    Pagination:
      type: object
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
        totalPages:
          type: integer

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string
          example: "Validation failed"
        details:
          type: array
          items:
            type: string
          example: ["username must be at least 3 characters"]

    UploadResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        count:
          type: integer
          example: 3
        urls:
          type: array
          items:
            $ref: "#/components/schemas/UploadResult"
        message:
          type: string
          example: "Uploaded"

    UploadResult:
      type: object
      properties:
        url:
          type: string
          format: uri
          example: "https://res.cloudinary.com/demo/image/upload/v123/example.jpg"
        resourceType:
          type: string
          example: "image"
        bytes:
          type: integer
          example: 102400

    RegistrationRequest:
      type: object
      properties:
        username:
          type: string
          minLength: 3
          example: "john_doe"
        email:
          type: string
          format: email
          example: "user@fixithub.com"
        password:
          type: string
          minLength: 6
          example: "SecurePass123!"
        role:
          type: string
          enum: [customer, worker]
          default: "customer"
        skills:
          type: array
          items:
            type: string
          example: ["electronics", "plumbing"]
        experience:
          type: string
          enum: [beginner, intermediate, expert]
        documents:
          type: array
          items:
            $ref: "#/components/schemas/CloudinaryDocument"
      required: [username, email, password, role]

    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          example: "user@fixithub.com"
        password:
          type: string
          example: "SecurePass123!"
      required: [email, password]

    LoginResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        user:
          $ref: "#/components/schemas/PrivateUser"
        message:
          type: string
          example: "Welcome to FixItHub!"

    ResetPasswordRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        code:
          type: string
          minLength: 6
          maxLength: 6
        newPassword:
          type: string
          minLength: 6
      required: [email, code, newPassword]

    AuctionListResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        count:
          type: integer
          example: 5
        data:
          type: array
          items:
            $ref: "#/components/schemas/AuctionDetails"

    AuctionDetails:
      type: object
      properties:
        id:
          type: string
          example: "507f1f77bcf86cd799439011"
        startingMaxPrice:
          type: number
          example: 199.99
        expiresAt:
          type: string
          format: date-time
        currentLowestBid:
          type: number
          example: 149.99
        repairRequest:
          $ref: "#/components/schemas/RepairRequestSummary"

    RepairRequestSummary:
      type: object
      properties:
        title:
          type: string
          example: "Smartphone Screen Replacement"
        category:
          type: string
          example: "electronics"
        itemType:
          type: string
          example: "iPhone 12 Pro"
        photos:
          type: array
          items:
            type: string
            format: uri
        createdAt:
          type: string
          format: date-time

    BidSubmissionRequest:
      type: object
      properties:
        bidPrice:
          type: number
          minimum: 0.01
          example: 129.99
        estimatedTimeDays:
          type: integer
          minimum: 1
          example: 3
      required: [bidPrice, estimatedTimeDays]

    BidResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "Bid submitted successfully"
        data:
          type: object
          properties:
            yourBid:
              type: number
              example: 129.99
            currentLowestBid:
              type: number
              example: 120.50

    AuctionBidsResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: "#/components/schemas/BidDetails"

    BidDetails:
      type: object
      properties:
        _id:
          type: string
        bidPrice:
          type: number
        estimatedTimeDays:
          type: integer
        worker:
          $ref: "#/components/schemas/WorkerPreview"
        isLowest:
          type: boolean

    WorkerPreview:
      type: object
      properties:
        username:
          type: string
          example: "tech_master"
        avatar:
          type: string
          format: uri
        rating:
          type: number
          example: 4.8

    AcceptanceResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            acceptedBid:
              $ref: "#/components/schemas/BidDetails"
            repair:
              $ref: "#/components/schemas/RepairRequestSummary"

    RepairRequestCreate:
      type: object
      properties:
        title:
          type: string
          minLength: 5
          example: "Laptop Screen Replacement"
        category:
          type: string
          enum: [electronics, furniture, appliances, other]
        issueDescription:
          type: string
          minLength: 20
          example: "Broken LCD panel with cracked glass"
        itemType:
          type: string
          example: "MacBook Pro 16-inch 2023"
        startingMaxPrice:
          type: number
          minimum: 1
          example: 299.99
        expiresAt:
          type: string
          format: date-time
        imageUrls:
          type: array
          items:
            type: string
            format: uri
          minItems: 1
        shippingRequired:
          type: boolean
          default: false
      required:
        - title
        - category
        - issueDescription
        - itemType
        - startingMaxPrice
        - expiresAt
        - imageUrls

    RepairRequestResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            repairRequest:
              $ref: "#/components/schemas/RepairDetails"
            auction:
              $ref: "#/components/schemas/AuctionDetails"

    RepairDetails:
      type: object
      properties:
        _id:
          type: string
        status:
          type: string
          enum:
            [
              pending,
              auction_open,
              in_progress,
              completed,
              cancelled,
              returning_to_customer,
            ]
        trackingUpdates:
          type: array
          items:
            $ref: "#/components/schemas/TrackingUpdate"

    TrackingUpdate:
      type: object
      properties:
        status:
          type: string
          enum:
            [
              received,
              diagnosing,
              repairing,
              quality_check,
              shipped,
              return_initiated,
            ]
        location:
          type: string
        timestamp:
          type: string
          format: date-time

    CancellationResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: object
          properties:
            repair:
              $ref: "#/components/schemas/RepairDetails"
            auction:
              $ref: "#/components/schemas/AuctionDetails"

    ReturnResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: object
          properties:
            status:
              type: string
            tracking:
              type: array
              items:
                $ref: "#/components/schemas/TrackingUpdate"

    # Add other schemas as needed

  responses:
    TooManyRequestsError:
      description: "Rate limit exceeded - try again later"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    UnauthorizedError:
      description: Missing or invalid authentication

    NotFoundError:
      description: The requested resource was not found

security:
  - BearerAuth: []
