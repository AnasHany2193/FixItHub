# ===================================================
#                   API METADATA
# ===================================================
openapi: 3.0.3
info:
  title: FixItHub API
  version: 1.0.0
  description: |
    ## FixItHub API Documentation
    Platform for buying, selling, and repairing used products

    ### Project Status
    - Development: Active
    - Environment: Production

  contact:
    name: FixItHub Support
    email: support@fixithub.com
  license:
    name: Proprietary
    url: https://fixithub.com/terms

servers:
  - url: http://localhost:5000
    description: Local development server
  - url: https://api.fixithub.com
    description: Production server

# ===================================================
#                 API TAGS DEFINITION
# ===================================================
# Tags help organize endpoints into logical groups
# Add new tags here when creating new endpoint categories
tags:
  - name: Service Health
    description: Service status monitoring
  - name: Root
    description: Base API endpoints
  - name: Users
    description: User profile management and listings
  - name: Authentication
    description: User registration, login, and session management
  - name: Password Management
    description: Password reset and recovery operations
  - name: Auctions
    description: Auction listing and management operations
  - name: Bids
    description: Bid submission and management operations
  - name: Media
    description: Handle multiple image uploads and return Cloudinary URLs
  - name: Repairs
    description: Repair request lifecycle management
  - name: Products
    description: Product listing and inventory management
  - name: Payments
    description: Payment processing operations
  - name: Reviews
    description: Review management and queries
  - name: Reports
    description: Content and behavior reporting
  - name: Admin
    description: Administrative operations

# ===================================================
#                API ENDPOINT DEFINITIONS
# ===================================================
# Paths define your API endpoints and operations
# Group related endpoints using tags
# Maintain consistent parameter naming conventions
paths:
  /:
    get:
      tags: [Root]
      summary: API Root
      description: Returns basic API information
      responses:
        "200":
          description: API root information
          content:
            text/html:
              example: |
                <h1>FixItHub API Service</h1>
                <p>Hello, 𝕬𝖓𝖔𝖔𝖘 🖤! Welcome to FixItHub Backend System 🚀</p>
                <ul>
                  <li><a href="/api-docs">API Documentation</a></li>
                  <li><a href="/api/v1/health">Service Health</a></li>
                </ul>

  /api/v1/health:
    get:
      tags: [Service Health]
      summary: Service Health Check
      description: Returns current service status and database connectivity
      responses:
        "200":
          description: Service health status
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: OK
                  db:
                    type: string
                    example: connected
                  version:
                    type: string
                    example: 1.0.0
                  environment:
                    type: string
                    example: development
                required:
                  - status
                  - db
                  - version
                  - environment

  /api/v1/users/me:
    get:
      tags: [Users]
      summary: Get authenticated user's profile
      description: Retrieve complete profile details for the logged-in user
      security:
        - BearerAuth: []
      responses:
        "200":
          description: User profile retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrivateUser"
        "401":
          $ref: "#/components/responses/UnauthorizedError"

    patch:
      tags: [Users]
      summary: Update user profile
      description: Update profile information for authenticated user
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                profile.bio:
                  type: string
                  maxLength: 500
                profile.phone:
                  type: string
                profile.address:
                  $ref: "#/components/schemas/Address"
                profile.socialMedia:
                  $ref: "#/components/schemas/SocialMedia"
                profile.avatar:
                  type: string
                  format: uri
      responses:
        "200":
          description: Profile updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrivateUser"
        "400":
          description: Invalid update data
        "401":
          $ref: "#/components/responses/UnauthorizedError"

  /api/v1/users/workers:
    get:
      tags: [Users]
      summary: List approved workers
      description: Get paginated list of approved service providers with filtering
      parameters:
        - in: query
          name: skills
          schema:
            type: string
          description: Comma-separated list of skills
        - in: query
          name: minRating
          schema:
            type: number
            minimum: 0
            maximum: 5
          description: Minimum average rating
        - in: query
          name: availability
          schema:
            type: string
            enum: [full-time, part-time]
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
      responses:
        "200":
          description: List of workers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedWorkers"

  /api/v1/users/customers:
    get:
      tags: [Users]
      summary: List customers (Admin only)
      description: Get paginated list of registered customers
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: city
          schema:
            type: string
          description: Filter by city
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
      responses:
        "200":
          description: List of customers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedCustomers"
        "403":
          description: Admin privileges required

  /api/v1/users/{id}:
    get:
      tags: [Users]
      summary: Get public user profile
      description: Retrieve public profile information for any user
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            pattern: "^[0-9a-fA-F]{24}$"
          description: Valid MongoDB ObjectId
      responses:
        "200":
          description: Public user profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicUser"
        "404":
          description: User not found

  /api/v1/upload:
    post:
      tags: [Media]
      summary: Upload image files
      description: Handle multiple image uploads and return Cloudinary URLs
      parameters:
        - in: header
          name: Content-Type
          required: true
          schema:
            type: string
            example: multipart/form-data
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                files:
                  type: array
                  items:
                    type: string
                    format: binary
                  description: Array of image files (max 5)
      responses:
        "200":
          description: Image upload successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadResponse"
        "400":
          description: Invalid file upload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Image processing error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/auth/register:
    post:
      tags: [Authentication]
      summary: Register new user
      description: Create customer/worker account (admin registration disabled)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegistrationRequest"
      responses:
        "201":
          description: Registration successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "403":
          description: Admin registration attempt
        "429":
          $ref: "#/components/responses/TooManyRequestsError"

  /api/v1/auth/verify-otp:
    post:
      tags: [Authentication]
      summary: Verify email with OTP
      description: Confirm user email using one-time password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OTPVerificationRequest"
      responses:
        "200":
          description: Email verified successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          description: Invalid/expired OTP
        "404":
          description: User not found

  /api/v1/auth/resend-otp:
    post:
      tags: [Authentication]
      summary: Resend verification OTP
      description: Request new OTP for email verification
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
              required: [email]
      responses:
        "200":
          description: New OTP sent successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          description: User already verified
        "429":
          $ref: "#/components/responses/TooManyRequestsError"

  /api/v1/auth/login:
    post:
      tags: [Authentication]
      summary: User login
      description: Authenticate user and issue access/refresh tokens
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
          headers:
            Set-Cookie:
              schema:
                type: string
                example: "refreshToken=abcde12345; Path=/; HttpOnly; Secure; SameSite=Strict"
        "401":
          description: Invalid credentials
        "403":
          description: Email not verified

  /api/v1/auth/refresh-token:
    post:
      tags: [Authentication]
      summary: Refresh access token
      description: Generate new access token using refresh token
      security: []
      responses:
        "200":
          description: New access token issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken:
                    type: string
        "401":
          description: Invalid/expired refresh token

  /api/v1/auth/forgot-password:
    post:
      tags: [Password Management]
      summary: Initiate password reset
      description: Send password reset OTP to registered email
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordRequest"
      responses:
        "200":
          description: OTP sent if email exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "429":
          $ref: "#/components/responses/TooManyRequestsError"

  /api/v1/auth/reset-password:
    post:
      tags: [Password Management]
      summary: Complete password reset
      description: Verify OTP and set new password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "200":
          description: Password reset successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          description: Invalid OTP or weak password

  /api/v1/auth/logout:
    post:
      tags: [Authentication]
      summary: Terminate session
      description: Invalidate refresh token and clear cookies
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Logout successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"

  /api/v1/auctions/available:
    get:
      tags: [Auctions]
      summary: Get available auctions
      description: List open auctions visible to workers
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: includeCustomer
          schema:
            type: boolean
            default: false
          description: Include customer details (admin only)
      responses:
        "200":
          description: List of available auctions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuctionListResponse"
        "403":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          description: No auctions found

  /api/v1/auctions/{auctionId}/bids:
    post:
      tags: [Bids]
      summary: Submit new bid
      description: Place bid on open auction (Worker only)
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: auctionId
          required: true
          schema:
            type: string
            pattern: "^[0-9a-fA-F]{24}$"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BidSubmissionRequest"
      responses:
        "201":
          description: Bid submitted successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BidResponse"
        "400":
          description: Invalid bid amount
        "429":
          $ref: "#/components/responses/TooManyRequestsError"

    get:
      tags: [Bids]
      summary: Get auction bids
      description: List all bids for specific auction
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: auctionId
          required: true
          schema:
            type: string
            pattern: "^[0-9a-fA-F]{24}$"
      responses:
        "200":
          description: Bids retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuctionBidsResponse"
        "404":
          description: Auction not found

  /api/v1/auctions/{auctionId}/bids/{bidId}:
    patch:
      tags: [Bids]
      summary: Update bid
      description: Modify existing bid (Worker only)
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: auctionId
          required: true
          schema:
            type: string
            pattern: "^[0-9a-fA-F]{24}$"
        - in: path
          name: bidId
          required: true
          schema:
            type: string
            pattern: "^[0-9a-fA-F]{24}$"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BidSubmissionRequest"
      responses:
        "200":
          description: Bid updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BidResponse"
        "403":
          description: Not bid owner

  /api/v1/auctions/{auctionId}/accept:
    post:
      tags: [Auctions]
      summary: Accept lowest bid
      description: Customer accepts winning bid and starts repair
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: auctionId
          required: true
          schema:
            type: string
            pattern: "^[0-9a-fA-F]{24}$"
      responses:
        "200":
          description: Bid accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptanceResponse"
        "403":
          description: Not auction owner

  /api/v1/repairs:
    post:
      tags: [Repairs]
      summary: Create repair request
      description: Customer creates new repair request with associated auction
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RepairRequestCreate"
      responses:
        "201":
          description: Repair request created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepairRequestResponse"
        "400":
          description: Invalid request data
        "429":
          $ref: "#/components/responses/TooManyRequestsError"

    get:
      tags: [Repairs]
      summary: Get active repairs
      description: List customer's active repair requests
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [pending, auction_open, in_progress]
      responses:
        "200":
          description: Repairs retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepairListResponse"

  /api/v1/repairs/{id}/status:
    patch:
      tags: [Repairs]
      summary: Update repair status
      description: Customer updates repair request status
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            pattern: "^[0-9a-fA-F]{24}$"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [cancelled, paused]
              required: [status]
      responses:
        "200":
          description: Status updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepairRequestResponse"

  /api/v1/repairs/{id}/cancel:
    patch:
      tags: [Repairs]
      summary: Cancel repair request
      description: Customer cancels repair and associated auction
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            pattern: "^[0-9a-fA-F]{24}$"
      responses:
        "200":
          description: Repair cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CancellationResponse"

  /api/v1/repairs/auctions:
    get:
      tags: [Repairs]
      summary: Get customer auctions
      description: List customer's active repair auctions
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Auctions retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuctionListResponse"

  /api/v1/repairs/history:
    get:
      tags: [Repairs]
      summary: Get repair history
      description: Customer's historical repair requests
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [completed, cancelled, returned]
        - in: query
          name: bidStatus
          schema:
            type: string
            enum: [pending, accepted, rejected]
      responses:
        "200":
          description: History retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepairHistoryResponse"

  /api/v1/repairs/{id}/complete:
    patch:
      tags: [Repairs]
      summary: Complete repair
      description: Worker marks repair as completed
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            pattern: "^[0-9a-fA-F]{24}$"
      responses:
        "200":
          description: Repair completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepairRequestResponse"

  /api/v1/repairs/{id}/shipping:
    patch:
      tags: [Repairs]
      summary: Update shipping status
      description: Worker updates item shipping status
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            pattern: "^[0-9a-fA-F]{24}$"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [shipped, in_transit, delivered]
                location:
                  type: string
              required: [status, location]
      responses:
        "200":
          description: Shipping updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShippingUpdateResponse"

  /api/v1/repairs/worker:
    get:
      tags: [Repairs]
      summary: Get worker's active repairs
      description: List repairs assigned to worker
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Repairs retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepairListResponse"

  /api/v1/repairs/worker/history:
    get:
      tags: [Repairs]
      summary: Get worker's repair history
      description: Historical repairs completed by worker
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [completed, returned]
      responses:
        "200":
          description: History retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepairHistoryResponse"

  /api/v1/repairs/{id}/return:
    patch:
      tags: [Repairs]
      summary: Initiate item return
      description: Worker returns item to customer
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            pattern: "^[0-9a-fA-F]{24}$"
      responses:
        "200":
          description: Return initiated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReturnResponse"

  /api/v1/products:
    post:
      tags: [Products]
      summary: Create new product
      description: Create product listing (Approved workers only)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductCreateRequest"
      responses:
        "201":
          description: Product created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductResponse"
        "400":
          description: Invalid input data
        "429":
          $ref: "#/components/responses/TooManyRequestsError"

    get:
      tags: [Products]
      summary: Search products
      description: Public product search with filters and geolocation
      parameters:
        - in: query
          name: q
          schema:
            type: string
          description: Search keywords
        - in: query
          name: lng
          schema:
            type: number
            format: float
          description: Longitude for location-based search
        - in: query
          name: lat
          schema:
            type: number
            format: float
          description: Latitude for location-based search
        - in: query
          name: radius
          schema:
            type: integer
            default: 5000
          description: Search radius in meters
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
          description: Page number
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
          description: Items per page
        - in: query
          name: minPrice
          schema:
            type: number
          description: Minimum price filter
        - in: query
          name: maxPrice
          schema:
            type: number
          description: Maximum price filter
      responses:
        "200":
          description: Products found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedProducts"

  /api/v1/products/{id}:
    patch:
      tags: [Products]
      summary: Update product
      description: Update product details (Owner only)
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            pattern: "^[0-9a-fA-F]{24}$"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductUpdateRequest"
      responses:
        "200":
          description: Product updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductResponse"

    delete:
      tags: [Products]
      summary: Delete product
