# ===================================================
#           GLOBAL COMPONENTS & SCHEMAS
# ===================================================
# Reusable components for:
# - Schemas (data models)
# - Parameters
# - Responses
# - Security Schemes
# - Examples
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Use JWT token for authentication

  schemas:
    Address:
      type: object
      properties:
        street:
          type: string
        city:
          type: string
        state:
          type: string
          maxLength: 2
        zip:
          type: string
        country:
          type: string
          default: "US"

    SocialMedia:
      type: object
      properties:
        website:
          type: string
          format: uri
        linkedin:
          type: string
          format: uri
        twitter:
          type: string
          format: uri

    PublicUser:
      type: object
      properties:
        _id:
          type: string
        username:
          type: string
        role:
          type: string
          enum: [customer, worker, admin]
        profile:
          type: object
          properties:
            avatar:
              type: string
        rating:
          $ref: "#/components/schemas/Rating"
        workerApplication:
          type: object
          properties:
            skills:
              type: array
              items:
                type: string

    PrivateUser:
      allOf:
        - $ref: "#/components/schemas/PublicUser"
        - type: object
          properties:
            email:
              type: string
              format: email
            status:
              type: string
              enum: [active, banned, pending, deactivated]
            createdAt:
              type: string
              format: date-time
            lastLogin:
              type: string
              format: date-time

    Rating:
      type: object
      properties:
        average:
          type: number
          format: float
          minimum: 0
          maximum: 5
        count:
          type: integer
          minimum: 0

    PaginatedWorkers:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: "#/components/schemas/PublicUser"
        pagination:
          $ref: "#/components/schemas/Pagination"

    PaginatedCustomers:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            type: object
            properties:
              _id:
                type: string
              username:
                type: string
              profile:
                type: object
                properties:
                  address:
                    $ref: "#/components/schemas/Address"
              createdAt:
                type: string
                format: date-time
              lastLogin:
                type: string
                format: date-time
        pagination:
          $ref: "#/components/schemas/Pagination"

    Pagination:
      type: object
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
        totalPages:
          type: integer

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string
          example: "Validation failed"
        details:
          type: array
          items:
            type: string
          example: ["username must be at least 3 characters"]

    UploadResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        count:
          type: integer
          example: 3
        urls:
          type: array
          items:
            $ref: "#/components/schemas/UploadResult"
        message:
          type: string
          example: "Uploaded"

    UploadResult:
      type: object
      properties:
        url:
          type: string
          format: uri
