openapi: 3.0.3
info:
  title: FixItHub API
  version: 1.0.0
  description: |
    Marketplace connecting users with repair service providers and refurbished products.
    Features include auction-based repair requests, product listings, and secure file uploads.
servers:
  - url: http://localhost:5000/api/v1
    description: Local development server
  - url: https://api.fixithub.com/api/v1
    description: Production server

# ======================
# Common Components
# ======================
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: token
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    User:
      type: object
      properties:
        _id:
          type: string
          format: mongoId
          example: 65f8d7e8cdf1b203f8d7e8cd
        username:
          type: string
          minLength: 3
          maxLength: 30
          example: tech_repair_guru
        email:
          type: string
          format: email
          example: user@fixithub.com
        role:
          type: string
          enum: [customer, worker, admin]
          default: customer
        profile:
          $ref: "#/components/schemas/UserProfile"
        workerApplication:
          $ref: "#/components/schemas/WorkerApplication"
        stats:
          $ref: "#/components/schemas/UserStats"
        rating:
          $ref: "#/components/schemas/UserRating"
        location:
          $ref: "#/components/schemas/GeoJSONPoint"
        status:
          type: string
          enum: [active, banned, pending, deactivated]
          default: active

    UserProfile:
      type: object
      properties:
        avatar:
          $ref: "#/components/schemas/CloudinaryImage"
        phone:
          type: string
          example: +1234567890
        address:
          $ref: "#/components/schemas/Address"
        bio:
          type: string
          maxLength: 500
          example: Certified electronics repair specialist
        socialMedia:
          $ref: "#/components/schemas/SocialMedia"

    WorkerApplication:
      type: object
      properties:
        skills:
          type: array
          items:
            type: string
            example: electronics
        certifications:
          type: array
          items:
            type: string
        experience:
          type: string
          enum: [beginner, intermediate, expert]
        status:
          type: string
          enum: [pending, approved, rejected]
        documents:
          type: array
          items:
            $ref: "#/components/schemas/CloudinaryDocument"
        workHistory:
          type: array
          items:
            $ref: "#/components/schemas/WorkHistory"
        availability:
          type: string
          enum: [full-time, part-time, unavailable]

    UserStats:
      type: object
      properties:
        completedRepairs:
          type: integer
          minimum: 0
        completedSales:
          type: integer
          minimum: 0
        responseRate:
          type: number
          minimum: 0
          maximum: 100

    UserRating:
      type: object
      properties:
        average:
          type: number
          minimum: 0
          maximum: 5
          example: 4.5
        count:
          type: integer
          minimum: 0

    GeoJSONPoint:
      type: object
      properties:
        type:
          type: string
          enum: [Point]
        coordinates:
          type: array
          items:
            type: number
          minItems: 2
          maxItems: 2
          example: [-73.935242, 40.730610]

    Address:
      type: object
      properties:
        street:
          type: string
        city:
          type: string
        state:
          type: string
          maxLength: 2
        zip:
          type: string
        country:
          type: string
          default: US

    SocialMedia:
      type: object
      properties:
        website:
          type: string
          format: uri
        linkedin:
          type: string
          format: uri
        twitter:
          type: string
          format: uri

    CloudinaryImage:
      type: object
      properties:
        url:
          type: string
          format: uri
        public_id:
          type: string

    WorkHistory:
      type: object
      properties:
        position:
          type: string
        company:
          type: string
        startYear:
          type: integer
          minimum: 1900
        endYear:
          type: integer
          minimum: 1900

# ======================
# API Endpoints
# ======================
paths:
  /users/me:
    get:
      tags: [Users]
      summary: Get current user's profile
      description: Retrieve authenticated user's profile (excluding sensitive data)
      security:
        - cookieAuth: []
      responses:
        200:
          description: User profile retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    patch:
      tags: [Users]
      summary: Update current user's profile
      description: Update profile information for authenticated user
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                profile.bio:
                  type: string
                  example: Updated bio text
                profile.phone:
                  type: string
                  example: +15551234567
                profile.address:
                  type: object
                  properties:
                    street:
                      type: string
                    city:
                      type: string
                    zipCode:
                      type: string
              example:
                profile.bio: "New bio description"
                profile.phone: "+15551234567"
      responses:
        200:
          description: Profile updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        400:
          description: Invalid update data
        401:
          description: Unauthorized

  /users/{id}:
    get:
      tags: [Users]
      summary: Get public user profile
      description: Retrieve public profile information for any user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: mongoId
          example: 65f8d7e8cdf1b203f8d7e8cd
      security:
        - cookieAuth: []
      responses:
        200:
          description: Public user data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        404:
          description: User not found

  /users/workers:
    get:
      tags: [Users]
      summary: Search service workers
      description: Find approved service providers with filtering and sorting
      parameters:
        - name: skills
          in: query
          schema:
            type: array
            items:
              type: string
              enum: [electronics, furniture, appliances]
          style: form
          explode: false
          example: electronics,furniture
        - name: minRating
          in: query
          schema:
            type: number
            minimum: 0
            maximum: 5
          example: 4.0
        - name: sort
          in: query
          schema:
            type: string
            enum: [rating.average, -rating.average, hourlyRate, -hourlyRate]
          example: -rating.average
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
          example: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
          example: 10
      security:
        - cookieAuth: []
      responses:
        200:
          description: Paginated list of workers
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/WorkerProfile"
                  pagination:
                    type: object
                    properties:
                      page:
                        type: integer
                      limit:
                        type: integer
                      total:
                        type: integer
                      totalPages:
                        type: integer
        400:
          description: Invalid filter parameters

  /users/customers:
    get:
      tags: [Users]
      summary: List all customers
      description: Retrieve paginated list of customer accounts
      parameters:
        - name: city
          in: query
          schema:
            type: string
          example: New York
        - name: page
          in: query
          schema:
            type: integer
          example: 1
        - name: limit
          in: query
          schema:
            type: integer
          example: 10
      security:
        - cookieAuth: []
      responses:
        200:
          description: Customer list retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/UserProfile"
                  pagination:
                    type: object
                    properties:
                      page:
                        type: integer
                      limit:
                        type: integer
                      total:
                        type: integer
        403:
          description: Forbidden (non-admin access)

  /document/upload:
    post:
      tags: [Media]
      summary: Upload multiple images
      description: Upload up to 5 images (max 2MB each) for listings/repair requests
      security:
        - cookieAuth: []
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                files:
                  type: array
                  items:
                    type: string
                    format: binary
      responses:
        200:
          description: Image URLs and metadata
          content:
            application/json:
              schema:
                type: object
                properties:
                  urls:
                    type: array
                    items:
                      type: object
                      properties:
                        url:
                          type: string
                          format: uri
                        resourceType:
                          type: string
                          example: image
                        bytes:
                          type: integer
                          example: 102400
        400:
          description: Invalid file upload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        413:
          description: File too large
