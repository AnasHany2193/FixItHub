openapi: 3.0.0
info:
  title: FixItHub API
  version: 1.0.0
  description: |
    Marketplace connecting users with repair service providers and refurbished products.
    Features include auction-based repair requests, product listings, and secure file uploads.
servers:
  - url: http://localhost:5000/api/v1
    description: Local development server
  - url: https://api.fixithub.com/api/v1
    description: Production server (requires authentication)

# ======================
# Common Components
# ======================
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        JWT authentication for protected endpoints. 
        Include like: `Authorization: Bearer <token>`

  schemas:
    UploadResult:
      type: object
      description: Successful upload response
      properties:
        success:
          type: boolean
          example: true
        count:
          type: integer
          description: Number of successfully uploaded files
          example: 3
        urls:
          type: array
          items:
            $ref: "#/components/schemas/CloudinaryFile"
      required: [success, count, urls]

    CloudinaryFile:
      type: object
      description: Uploaded file metadata
      properties:
        url:
          type: string
          format: uri
          example: "https://res.cloudinary.com/demo/image/upload/v123/image.jpg"
        resourceType:
          type: string
          enum: [image, video, raw]
          example: "image"
        bytes:
          type: integer
          description: File size in bytes
          example: 102400

  responses:
    BadRequest:
      description: Invalid request parameters
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              error:
                type: string
                example: "Invalid file type"

    FileTooLarge:
      description: File exceeds size limit (5MB)
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              error:
                type: string
                example: "File size exceeds 5MB limit"

    TooManyRequests:
      description: Rate limit exceeded
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              error:
                type: string
                example: "Too many requests, please try again later"

    BadGateway:
      description: Third-party service error
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              error:
                type: string
                example: "Cloudinary service unavailable"

  parameters:
    UploadFiles:
      in: formData
      name: images
      required: true
      style: form
      explode: false
      description: |
        Array of image files (max 5 files, 5MB each).
        Supported formats: JPEG, PNG, WEBP, AVIF, SVG
      schema:
        type: array
        maxItems: 5
        items:
          type: string
          format: binary

# ======================
# API Endpoints
# ======================
paths:
  /document/upload:
    post:
      tags: [Uploads]
      summary: Upload multiple images for repair requests or product listings
      description: |
        Securely upload up to 5 images with automatic malware scanning and EXIF removal.
        Returns Cloudinary URLs for use in other endpoints.
      security:
        - BearerAuth: []
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/parameters/UploadFiles"
      responses:
        200:
          description: Files uploaded successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadResult"
        400:
          $ref: "#/components/responses/BadRequest"
        413:
          $ref: "#/components/responses/FileTooLarge"
        429:
          $ref: "#/components/responses/TooManyRequests"
        502:
          $ref: "#/components/responses/BadGateway"

  # Other endpoints...
